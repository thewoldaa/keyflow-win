name: build

# ---------------------------------------------------------------------------
# Configure, build and test on Windows, plus two fast checks that answer while
# the Windows job is still queueing.
#
# The unit tests run on Linux as well as Windows, because the core library has
# no Windows header in it. That is not portability for its own sake: it means
# the model and the project format get feedback from a runner that starts in
# seconds, and the Windows job is left to answer the question only it can —
# does the application build and do the shaders compile.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  core:
    name: core and tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/ci -DKEYFLOW_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/ci --parallel

      # No WebView2, no OpenGL, no window: just the model, the project format,
      # the catalogue and the shader table.
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  shaders:
    name: shader table is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gersemi
        run: pip install gersemi

      # A shader edited without regenerating ShaderTable.cpp would ship the
      # previous shader, and nothing else would notice.
      - name: Check formatting
        run: |
          gersemi --check \
            CMakeLists.txt \
            src/CMakeLists.txt \
            tests/CMakeLists.txt

  build-windows:
    name: build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache WebView2 SDK
        uses: actions/cache@v4
        with:
          path: third_party
          # Keyed on the script that pins the version, so bumping the version
          # in the script invalidates the cache automatically.
          key: webview2-${{ hashFiles('scripts/fetch-deps.ps1') }}

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Check the shader table is current
        shell: pwsh
        run: ./scripts/embed-shaders.ps1 -Check

      - name: Configure
        shell: pwsh
        run: cmake --preset ci

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci

      - name: Test
        shell: pwsh
        run: ctest --preset ci

      # The self-test compiles every shader against the runner's driver. A
      # GitHub runner has no GPU, so this is expected to report that the
      # renderer did not start — which is a pass, because the question it
      # answers is "do the shaders compile on a machine that has a driver",
      # and a runner without one cannot answer it. It is run anyway so the
      # step exists and its failure mode is visible.
      - name: Shader self-test
        shell: pwsh
        continue-on-error: true
        run: ./build/ci/bin/keyflow.exe --self-test

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/ci/Testing/Temporary/LastTest.log
            build/ci/src/**/*.log
          if-no-files-found: ignore
